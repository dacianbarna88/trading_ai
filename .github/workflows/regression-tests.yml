name: Regression Tests

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repo-wide compile sweep
        run: python3 -m py_compile $(git ls-files '*.py')

      - name: Market gate regression suite
        run: python3 tae_market_gate_regression_test.py

      - name: Runtime startup regression suite
        run: python3 tae_runtime_startup_regression_test.py

      - name: Portfolio invariant regression suite
        run: python3 tae_portfolio_invariant_regression_test.py

      - name: Scoring formulas regression suite
        run: python3 tae_scoring_formulas_regression_test.py

      - name: V5.1 policy shadow regression suite
        run: python3 tae_v51_policy_shadow_regression_test.py

      - name: Portfolio integrity guardian regression suite
        run: python3 tae_portfolio_integrity_guardian_regression_test.py
